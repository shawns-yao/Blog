name: "${RAG_TEST_PROJECT:?Use Test/benchmark/rag-test-environment.mjs}"

services:
  postgres:
    image: postgres:17-alpine
    container_name: "${RAG_TEST_PROJECT}-postgres"
    environment:
      POSTGRES_DB: rag_benchmark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_benchmark"]
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      io.shawn-blog.rag-test: "true"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: "${RAG_TEST_PROJECT}-redis"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    image: golang:1.25-alpine
    container_name: "${RAG_TEST_PROJECT}-server"
    working_dir: /src
    command: ["sh", "-c", "go mod download && exec go run ./cmd/api"]
    env_file:
      - ../server/.env
    environment:
      APP_NAME: "${RAG_TEST_PROJECT}"
      APP_ENV: test
      APP_PORT: "8080"
      DB_DRIVER: postgres
      DB_DSN: "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/rag_benchmark?sslmode=disable"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_PREFIX: "rag-test:"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required}"
      RAG_ENABLED: "true"
      RAG_EVALUATION_TRACE_DIR: /evaluation
      RAG_CHAT_GPT_BASE_URL: "${RAG_TEST_GPT_BASE_URL:?GPT URL is required}"
      APP_UPDATE_CHECK_ENABLED: "false"
      HTMLSNAPSHOT_BASE_URL: "http://127.0.0.1:1"
      MEDIA_R2_ENDPOINT: ""
      MEDIA_R2_ACCESS_KEY_ID: ""
      MEDIA_R2_SECRET_ACCESS_KEY: ""
    ports:
      - "127.0.0.1:${RAG_TEST_PORT}:8080"
    volumes:
      - ../server:/src:ro
      - storage:/src/storage
      - evaluation:/evaluation
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      io.shawn-blog.rag-test: "true"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage:
  evaluation:
  go_mod_cache:
    external: true
    name: "${RAG_TEST_GO_MOD_VOLUME:-grtblog_go_mod}"
  go_build_cache:
    external: true
    name: "${RAG_TEST_GO_BUILD_VOLUME:-grtblog_go_build}"
