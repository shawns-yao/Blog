services:
  server:
    environment:
      MUSIC_ENABLED: "${MUSIC_ENABLED:-false}"
      MUSIC_NAVIDROME_URL: http://navidrome:4533
      MUSIC_NAVIDROME_USER: "${MUSIC_NAVIDROME_USER:-}"
      MUSIC_NAVIDROME_PASSWORD: "${MUSIC_NAVIDROME_PASSWORD:-}"
      MUSIC_ALLOWED_USER_IDS: "${MUSIC_ALLOWED_USER_IDS:-}"
      MUSIC_LIBRARY_DIR: /app/storage/music/library
      MUSIC_STAGING_DIR: /app/storage/music/staging
      MUSIC_MAX_UPLOAD_BYTES: "${MUSIC_MAX_UPLOAD_BYTES:-104857600}"
      MUSIC_MAX_BIT_RATE: "${MUSIC_MAX_BIT_RATE:-192}"
      MUSIC_FFMPEG_BINARY: "${MUSIC_FFMPEG_BINARY:-ffmpeg}"
    volumes:
      - ./storage/music:/app/storage/music
    depends_on:
      navidrome:
        condition: service_started

  navidrome:
    image: deluan/navidrome:0.64.2
    user: "10001:10001"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_TRANSCODINGCACHESIZE: "${MUSIC_TRANSCODING_CACHE_SIZE:-1GB}"
      ND_LYRICSPRIORITY: ".lrc,.txt,embedded"
      ND_SCANSCHEDULE: "@every 1h"
      ND_ENABLESHARING: "false"
      ND_LOGLEVEL: warn
    volumes:
      - ./storage/music/library:/music:ro
      - ./storage/navidrome:/data
    ports:
      - "127.0.0.1:4533:4533"
    networks:
      - shawn-blog-internal
    restart: unless-stopped
