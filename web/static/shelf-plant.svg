<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 330 400" role="img" aria-labelledby="title desc">
  <title id="title">垂吊书架盆栽</title>
  <desc id="desc">一盆叶片层叠、藤蔓自然垂落并伸向书本的绿萝</desc>
  <defs>
    <style>
      g[id^="leaf-"] > path:first-child { stroke-opacity: .18; }
      g[id^="leaf-"] > path:not(:first-child) { stroke-width: .7; stroke-opacity: .25; }
    </style>
    <linearGradient id="leaf-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b9c59"/>
      <stop offset=".35" stop-color="#74804b"/>
      <stop offset=".72" stop-color="#4c623c"/>
      <stop offset="1" stop-color="#344c34"/>
    </linearGradient>
    <linearGradient id="leaf-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6b878"/>
      <stop offset=".27" stop-color="#a1a15e"/>
      <stop offset=".62" stop-color="#778347"/>
      <stop offset="1" stop-color="#4b623b"/>
    </linearGradient>
    <linearGradient id="leaf-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8650"/>
      <stop offset=".48" stop-color="#52673f"/>
      <stop offset="1" stop-color="#314a32"/>
    </linearGradient>
    <linearGradient id="pot-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3a371"/>
      <stop offset=".24" stop-color="#b57750"/>
      <stop offset=".68" stop-color="#7d4b37"/>
      <stop offset="1" stop-color="#4a2b22"/>
    </linearGradient>
    <linearGradient id="pot-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b98a"/>
      <stop offset=".5" stop-color="#a76849"/>
      <stop offset="1" stop-color="#60382b"/>
    </linearGradient>
    <radialGradient id="soil" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#705139"/>
      <stop offset=".55" stop-color="#432f25"/>
      <stop offset="1" stop-color="#211713"/>
    </radialGradient>
    <filter id="plant-shadow" x="-35%" y="-30%" width="180%" height="190%">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="8" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#29351c" flood-opacity=".22"/>
    </filter>
    <filter id="pot-shadow" x="-40%" y="-30%" width="190%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="12" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#291910" flood-opacity=".3"/>
    </filter>

    <g id="leaf-a">
