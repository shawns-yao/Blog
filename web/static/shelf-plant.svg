      <path d="M0-3V-45" fill="none" stroke="#829c68" stroke-opacity=".42" stroke-width="1.4"/>
      <path d="m0-18-14-15M0-25l15-12M0-34l10-10" fill="none" stroke="#91a66f" stroke-opacity=".2" stroke-width="1"/>
    </g>
    <g id="leaf-folded">
      <path d="M0 0C-17-6-23-20-16-33-7-45 11-42 28-55 23-39 33-27 22-15 15-8 6-5 0 0Z" fill="url(#leaf-deep)" stroke="#1a3527" stroke-width=".7"/>
      <path d="M1-4Q17-22 25-48Q18-35 8-31L-4-18Z" fill="#c0bd7b" opacity=".23"/>
      <path d="M-1-3C6-14 12-26 18-40" fill="none" stroke="#a5b379" stroke-opacity=".46" stroke-width="1.4"/>
      <path d="M-24-31c9-8 20-10 31-6" fill="none" stroke="#e0e8af" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="leaf-curled">
      <path d="M0 0C-18-9-29-26-21-40-16-48-1-50 5-59 3-44 20-30 14-16 10-8 6-3 0 0Z" fill="url(#leaf-warm)" stroke="#2c462f" stroke-width=".7"/>
      <path d="M0-3C2-17 3-31 2-45" fill="none" stroke="#d8ce83" stroke-opacity=".46" stroke-width="1.3"/>
      <path d="M-20-37c7-8 15-10 22-7" fill="none" stroke="#fff0b1" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="leaf-narrow">
      <path d="M0 0C-8-13-8-28 2-40 10-48 21-49 27-58 24-38 29-29 19-15 12-6 6-3 0 0Z" fill="url(#leaf-shadow)" stroke="#172f23" stroke-width=".7"/>
      <path d="M1-3C7-16 13-29 21-42" fill="none" stroke="#8fa46e" stroke-opacity=".44" stroke-width="1.3"/>
    </g>
    <g id="leaf-young">
      <path d="M0 0C-10-7-14-20-7-30 0-39 13-38 19-47 19-32 24-22 16-12 10-5 5-2 0 0Z" fill="url(#leaf-warm)" stroke="#29432c" stroke-width=".7"/>
      <path d="M1-2C5-12 10-23 15-33" fill="none" stroke="#d8ce83" stroke-opacity=".43" stroke-width="1.2"/>
    </g>
  </defs>

  <g fill="none" stroke-linecap="round">
